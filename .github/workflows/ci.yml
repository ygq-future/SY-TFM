name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # 前端 lint + format + test
  # ============================================================
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bunx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css}"

      - name: Test
        run: bun run test

  # ============================================================
  # Rust 编译检查 + 测试 + 类型导出
  # ============================================================
  rust:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps (for tauri build context)
        run: bun install --frozen-lockfile

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo check (default)
        working-directory: src-tauri
        run: cargo check --verbose

      - name: Cargo check (protocol-adapters)
        working-directory: src-tauri
        run: cargo check --features protocol-adapters --verbose

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --features protocol-adapters -- -D warnings

      - name: Cargo test (type export + unit tests)
        working-directory: src-tauri
        run: cargo test --features protocol-adapters --verbose

      - name: Verify generated TS types are up to date
        run: |
          git diff --exit-code src/types/ || (
            echo "❌ TS 类型文件与 Rust 定义不一致，请运行 cargo test --test export_types 并提交更新"
            exit 1
          )

  # ============================================================
  # 桌面端构建 (Windows)
  # ============================================================
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: bun run tauri build
        env:
          CARGO_FEATURES: protocol-adapters
