[package]
name = "sy-tfm-android-storage"
version = "1.0.0"
edition = "2021"
links = "sy-tfm-android-storage"

[lib]
name = "sy_tfm_android_storage"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
