[package]
name = "sy-tfm"
version = "1.0.0"
description = "SY-TFM — Tiny File Manager"
authors = ["Sheepyu"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "sy_tfm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
# 协议实现库：optional，通过 feature 门控。
# russh 间接依赖 aws-lc-sys，reqwest(rustls) 直接依赖 aws-lc-sys，均需 cmake + nasm。
russh = { version = "0.62.2", optional = true }
russh-sftp = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
quick-xml = { version = "0.38", features = ["serialize"], optional = true }
futures-util = { version = "0.3", optional = true }
chrono = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
parking_lot = "0.12"
notify = "8"
fs2 = "0.4"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
ts-rs = { version = "11", features = ["uuid-impl", "serde-json-impl"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
# 发布构建默认启用生产资源协议与首版协议 adapter；`tauri dev` 会由 CLI 关闭默认 feature。
default = ["custom-protocol", "protocol-adapters"]
# Tauri CLI 管理的生产资源协议。缺失时 Release 会继续尝试访问开发服务器。
custom-protocol = ["tauri/custom-protocol"]
# 启用 SFTP adapter（russh + russh-sftp）
sftp-adapter = ["dep:russh", "dep:russh-sftp"]
# 启用 WebDAV adapter（reqwest + quick-xml + futures-util）
webdav-adapter = ["dep:reqwest", "dep:quick-xml", "dep:futures-util"]
# 启用全部协议 adapter
protocol-adapters = ["sftp-adapter", "webdav-adapter"]

# Tauri 自定义命令测试入口
[[test]]
name = "export_types"
path = "tests/export_types.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
